    <!-- ===== LDI LOADER ===== -->
    <style>
        /* ─── LOCK BODY ─────────────────────────────── */
        
        body.ldi-loading {
            overflow: hidden;
        }
        /* ─── FULL-SCREEN OVERLAY ───────────────────── */
        
        #ldi-loader {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #081636 0%, #908888 55%, #0a0e39 100%);
            overflow: hidden;
            transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #ldi-loader.ldi-hide {
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
            pointer-events: none;
        }
        /* ─── STARFIELD ──────────────────────────────── */
        
        #ldi-stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        
        .ldi-star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: ldiStarTwinkle ease-in-out infinite;
        }
        
        @keyframes ldiStarTwinkle {
            0%,
            100% {
                opacity: 0.1;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }
        /* ─── GOLDEN DUST PARTICLES ──────────────────── */
        
        .ldi-dust {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: ldiDustRise linear infinite;
        }
        
        @keyframes ldiDustRise {
            0% {
                transform: translateY(110vh) translateX(0) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-15vh) translateX(var(--dx, 0px)) scale(1.6);
                opacity: 0;
            }
        }
        /* ─── ROTATING SEALS (rings) ─────────────────── */
        
        .ldi-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        
        .ldi-ring-1 {
            width: 460px;
            height: 460px;
            border-color: rgba(212, 160, 23, 0.18);
            animation: ldiSpin 18s linear infinite;
            box-shadow: 0 0 30px rgba(212, 160, 23, 0.05), inset 0 0 30px rgba(212, 160, 23, 0.03);
        }
        
        .ldi-ring-2 {
            width: 400px;
            height: 400px;
            border-style: dashed;
            border-color: rgba(212, 160, 23, 0.12);
            animation: ldiSpin 12s linear infinite reverse;
        }
        
        .ldi-ring-3 {
            width: 340px;
            height: 340px;
            border-color: rgba(74, 143, 212, 0.18);
            animation: ldiSpin 8s linear infinite;
        }
        
        .ldi-ring-4 {
            width: 280px;
            height: 280px;
            border-color: rgba(212, 160, 23, 0.25);
            animation: ldiPulseRing 3s ease-in-out infinite;
        }
        
        .ldi-ring-5 {
            width: 230px;
            height: 230px;
            border-color: rgba(74, 143, 212, 0.15);
            animation: ldiPulseRing 2.5s ease-in-out 0.5s infinite reverse;
        }
        
        @keyframes ldiSpin {
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes ldiPulseRing {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }
        /* ─── ORBITING DOTS ──────────────────────────── */
        
        .ldi-orbit {
            position: absolute;
            border-radius: 50%;
        }
        
        .ldi-orbit-a {
            width: 420px;
            height: 420px;
            animation: ldiSpin 4s linear infinite;
        }
        
        .ldi-orbit-a::before {
            content: '';
            position: absolute;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, #f5d060, #d4a017);
            box-shadow: 0 0 20px 6px rgba(212, 160, 23, 0.8), 0 0 40px 10px rgba(212, 160, 23, 0.4);
        }
        
        .ldi-orbit-b {
            width: 360px;
            height: 360px;
            animation: ldiSpin 7s linear infinite reverse;
        }
        
        .ldi-orbit-b::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #80c0ff, #4a8fd4);
            box-shadow: 0 0 16px 5px rgba(74, 143, 212, 0.8);
        }
        
        .ldi-orbit-c {
            width: 300px;
            height: 300px;
            animation: ldiSpin 5.5s linear infinite;
        }
        
        .ldi-orbit-c::before {
            content: '';
            position: absolute;
            top: -4px;
            right: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff8e0, #d4a017);
            box-shadow: 0 0 12px 4px rgba(212, 160, 23, 0.6);
        }
        /* ─── LOGO BURST GLOW ────────────────────────── */
        
        .ldi-glow-core {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.20) 0%, rgba(26, 61, 109, 0.15) 45%, transparent 72%);
            animation: ldiGlowPulse 2.8s ease-in-out infinite;
            filter: blur(8px);
        }
        
        @keyframes ldiGlowPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.25);
                opacity: 1;
            }
        }
        /* ─── LOGO WRAP ──────────────────────────────── */
        
        .ldi-logo-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* ─── LOGO IMAGE ─────────────────────────────── */
        
        .ldi-logo-img {
            width: 210px;
            height: 210px;
            object-fit: contain;
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.3) rotate(-25deg);
            animation: ldiLogoIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards, ldiLogoFloat 4.5s ease-in-out 1.5s infinite;
            filter: drop-shadow(0 0 40px rgba(212, 160, 23, 0.6)) drop-shadow(0 0 80px rgba(212, 160, 23, 0.3)) drop-shadow(0 0 120px rgba(212, 160, 23, 0.1)) brightness(1.1);
        }
        
        @keyframes ldiLogoIn {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-25deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.08) rotate(4deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }
        
        @keyframes ldiLogoFloat {
            0%,
            100% {
                transform: translateY(0px);
                filter: drop-shadow(0 0 40px rgba(212, 160, 23, 0.6)) drop-shadow(0 0 80px rgba(212, 160, 23, 0.3)) brightness(1.1);
            }
            50% {
                transform: translateY(-14px);
                filter: drop-shadow(0 0 55px rgba(212, 160, 23, 0.8)) drop-shadow(0 0 100px rgba(212, 160, 23, 0.4)) brightness(1.2);
            }
        }
        /* ─── SHIMMER FLASH on logo appear ──────────────── */
        
        .ldi-logo-wrap::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 150, 0.7), transparent 70%);
            transform: translate(-50%, -50%);
            animation: ldiBurst 0.6s ease-out 1.1s forwards;
            opacity: 0;
        }
        
        @keyframes ldiBurst {
            0% {
                width: 0;
                height: 0;
                opacity: 0.9;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }
        /* ─── TITLE LINE ─────────────────────────────── */
        
        .ldi-title-ar {
            margin-top: 22px;
            font-family: 'Cairo', sans-serif;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            text-align: center;
            background: linear-gradient(135deg, #c8920a 0%, #f5d060 30%, #fffbe0 50%, #f5d060 70%, #c8920a 100%);
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            transform: translateY(22px);
            animation: ldiFadeUp 0.7s ease 1.0s forwards, ldiShimmer 3.5s linear 1.8s infinite;
            text-shadow: none;
        }
        
        .ldi-title-en {
            margin-top: 5px;
            font-family: 'Cairo', sans-serif;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            font-weight: 500;
            letter-spacing: 0.25em;
            text-align: center;
            color: rgba(212, 160, 23, 0.6);
            opacity: 0;
            transform: translateY(14px);
            animation: ldiFadeUp 0.7s ease 1.3s forwards;
            text-transform: uppercase;
        }
        
        .ldi-tagline {
            margin-top: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.08em;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            animation: ldiFadeUp 0.7s ease 1.55s forwards;
        }
        
        @keyframes ldiFadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes ldiShimmer {
            to {
                background-position: 250% center;
            }
        }
        /* ─── PROGRESS BAR ───────────────────────────── */
        
        .ldi-progress-wrap {
            margin-top: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: ldiFadeUp 0.6s ease 1.6s forwards;
        }
        
        .ldi-bar-track {
            width: min(260px, 60vw);
            height: 3px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 3px;
            overflow: visible;
            position: relative;
        }
        
        .ldi-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            background: linear-gradient(90deg, #1a3d6d 0%, #d4a017 50%, #f5d060 100%);
            box-shadow: 0 0 12px rgba(212, 160, 23, 0.7);
            animation: ldiBarFill 3.2s cubic-bezier(0.3, 0, 0.2, 1) 0.5s forwards;
            position: relative;
        }
        
        .ldi-bar-fill::after {
            content: '';
            position: absolute;
            right: -1px;
            top: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f5d060;
            box-shadow: 0 0 12px 4px rgba(245, 208, 96, 0.8);
        }
        
        @keyframes ldiBarFill {
            0% {
                width: 0%;
            }
            40% {
                width: 55%;
            }
            70% {
                width: 80%;
            }
            90% {
                width: 96%;
            }
            100% {
                width: 100%;
            }
        }
        /* ─── LOADING DOTS ───────────────────────────── */
        
        .ldi-dots {
            display: flex;
            gap: 9px;
        }
        
        .ldi-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(212, 160, 23, 0.35);
            animation: ldiDot 1.4s ease-in-out infinite;
        }
        
        .ldi-dots span:nth-child(1) {
            animation-delay: 0s;
        }
        
        .ldi-dots span:nth-child(2) {
            animation-delay: 0.22s;
        }
        
        .ldi-dots span:nth-child(3) {
            animation-delay: 0.44s;
        }
        
        @keyframes ldiDot {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                background: rgba(212, 160, 23, 0.25);
            }
            40% {
                transform: scale(1.4);
                background: #d4a017;
                box-shadow: 0 0 12px rgba(212, 160, 23, 0.7);
            }
        }
        /* ─── CORNER ACCENTS ─────────────────────────── */
        
        .ldi-corner {
            position: absolute;
            width: 55px;
            height: 55px;
            opacity: 0;
            animation: ldiFadeUp 0.5s ease 0.2s forwards;
        }
        
        .ldi-corner.tl {
            top: 28px;
            left: 28px;
            border-top: 2px solid rgba(212, 160, 23, 0.5);
            border-left: 2px solid rgba(212, 160, 23, 0.5);
        }
        
        .ldi-corner.tr {
            top: 28px;
            right: 28px;
            border-top: 2px solid rgba(212, 160, 23, 0.5);
            border-right: 2px solid rgba(212, 160, 23, 0.5);
        }
        
        .ldi-corner.bl {
            bottom: 28px;
            left: 28px;
            border-bottom: 2px solid rgba(212, 160, 23, 0.5);
            border-left: 2px solid rgba(212, 160, 23, 0.5);
        }
        
        .ldi-corner.br {
            bottom: 28px;
            right: 28px;
            border-bottom: 2px solid rgba(212, 160, 23, 0.5);
            border-right: 2px solid rgba(212, 160, 23, 0.5);
        }
        /* ─── SCAN LINE ──────────────────────────────── */
        
        .ldi-scanline {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 160, 23, 0.35) 40%, rgba(212, 160, 23, 0.35) 60%, transparent);
            animation: ldiScan 4s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes ldiScan {
            0% {
                top: -2px;
            }
            100% {
                top: 100%;
            }
        }
        /* ─── RESPONSIVE ─────────────────────────────── */
        
        @media (max-width: 480px) {
            .ldi-ring-1 {
                width: 320px;
                height: 320px;
            }
            .ldi-ring-2 {
                width: 280px;
                height: 280px;
            }
            .ldi-ring-3 {
                width: 240px;
                height: 240px;
            }
            .ldi-ring-4 {
                width: 200px;
                height: 200px;
            }
            .ldi-ring-5 {
                width: 165px;
                height: 165px;
            }
            .ldi-orbit-a {
                width: 300px;
                height: 300px;
            }
            .ldi-orbit-b {
                width: 260px;
                height: 260px;
            }
            .ldi-orbit-c {
                width: 215px;
                height: 215px;
            }
            .ldi-logo-img {
                width: 160px;
                height: 160px;
            }
        }
    </style>

    <style>
        /* New Tech Team Layout CSS */
        .tech-team-page {
            font-family: 'Cairo', sans-serif;
            color: #fff;
            direction: rtl;
            overflow-x: hidden;
            padding-bottom: 80px;
            background-image: url('https://f49838zn07.ufs.sh/f/kOegvl1c9uGzLBaDOYGT6NyOw3KncvUAzSM9sq0CW7hZHprk'); /* Light Mode Background */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        
        /* Subtle overlay to ensure text readability in light mode if needed */
        .tech-team-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2); /* Very subtle overlay */
            z-index: 0;
            pointer-events: none;
        }
        
        body.dark-mode .tech-team-page::before,
        body.dark-theme .tech-team-page::before {
            background: transparent; /* No overlay in dark mode */
        }

        body.dark-mode .tech-team-page,
        body.dark-theme .tech-team-page {
            background-image: url('https://f49838zn07.ufs.sh/f/kOegvl1c9uGzPAQs3igEbWGUIu3HDxNSg2L5VhtXKJnaizYl'); /* Dark Mode Background */
        }

        /* Hero Section */
        .team-hero {
            position: relative;
            text-align: center;
            padding: 100px 20px 80px;
        }

        .float-1 { width: 300px; height: 300px; background: rgba(212, 160, 23, 0.1); top: 50px; right: -100px; animation-delay: 0s; }
        .float-2 { width: 250px; height: 250px; background: rgba(26, 61, 109, 0.3); bottom: 0; left: -50px; animation-delay: -4s; }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* Carousel Section */
        .carousel-wrapper {
            position: relative;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            padding: 40px 0;
        }

        .carousel-track {
            display: flex;
            gap: 30px;
            padding: 20px 50vw 40px; /* Padding to allow first/last items to center */
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none; /* Firefox */
        }
        .carousel-track::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Spacer elements to center first and last items */
        .carousel-spacer {
            flex: 0 0 auto;
            width: calc(50vw - 175px); /* Half screen minus half card width (350/2) */
        }

        /* Member Cards */
        .member-card {
            flex: 0 0 auto;
            width: 320px;
            height: 480px;
            scroll-snap-align: center;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            transform: scale(0.85);
            opacity: 0.6;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #081636;
        }

        .member-card.active {
            transform: scale(1.05);
            opacity: 1;
            box-shadow: 0 15px 60px rgba(212, 160, 23, 0.5); /* Faded glow without hard lines */
            border: none; /* Removed the hard line */
            z-index: 10;
        }

        /* Leader Badge */
        .leader-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(90deg, var(--accent-gold), #fff);
            color: #081636;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Card Image */
        .member-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .member-card.active .member-img {
            transform: scale(1.05);
        }

        /* Card Content Overlay */
        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 30px 30px;
            background: linear-gradient(to top, rgba(8, 22, 54, 0.95) 0%, rgba(8, 22, 54, 0.8) 50%, transparent 100%);
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .member-card.active .card-content {
            transform: translateY(0);
            opacity: 1;
        }

        .card-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-role {
            font-size: 0.9rem;
            color: #eee;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Socials & Action */
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social-links {
            display: flex;
            gap: 12px;
            direction: ltr;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #fff;
            transition: all 0.3s ease;
        }

        .social-links a svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .social-links a:hover {
            background: var(--accent-gold);
            color: #081636;
            transform: translateY(-3px);
        }

        .contact-btn {
            padding: 8px 20px;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: var(--accent-gold);
            color: #081636;
        }

        /* Navigation Arrows */
        .carousel-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--accent-gold);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        body.dark-theme .nav-btn,
        body.dark-mode .nav-btn {
            color: var(--accent);
        }

        .nav-btn:hover {
            background: var(--accent-gold);
            color: #081636;
            border-color: var(--accent-gold);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .member-card, .member-card.active { 
                width: 280px; height: 420px; 
                opacity: 1;
                transform: scale(1) !important;
                border-color: rgba(255,255,255,0.1);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                filter: none;
            }
            .carousel-spacer { display: none; }

    <!-- ===== LDI LOADER SCRIPT ===== -->
    <script>
        (function() {
            document.body.classList.add('ldi-loading');
            // Build starfield
            var sf = document.getElementById('ldi-stars');
            for (var i = 0; i < 80; i++) {
                var el = document.createElement('div');
                el.className = 'ldi-star';
                var sz = Math.random() * 2.5 + 0.5;
                el.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (Math.random() * 100) + '%;top:' + (Math.random() * 100) + '%;animation-duration:' + (Math.random() * 4 + 2) + 's;animation-delay:' + (Math.random() * 5) + 's;';
                sf.appendChild(el);
            }
            // Build dust
            var loader = document.getElementById('ldi-loader');
            for (var j = 0; j < 50; j++) {
                var d = document.createElement('div');
                d.className = 'ldi-dust';
                var ds = Math.random() * 7 + 2;
                var dx = (Math.random() - 0.5) * 200;
                d.style.cssText = 'width:' + ds + 'px;height:' + ds + 'px;left:' + (Math.random() * 100) + '%;background:radial-gradient(circle,rgba(212,160,23,' + (Math.random() * 0.7 + 0.3) + '),rgba(212,160,23,0));--dx:' + dx + 'px;animation-duration:' + (Math.random() * 9 + 5) + 's;animation-delay:' + (Math.random() * 7) + 's;';
                loader.appendChild(d);
            }
            // Dismiss logic
            var MIN = 1250,
                ready = false,
                timed = false;

            function tryHide() {
                if (ready && timed) {
                    loader.classList.add('ldi-hide');
                    document.body.classList.remove('ldi-loading');
                    loader.addEventListener('transitionend', function() {
                        loader.remove();
                    }, {
                        once: true
                    });
                }
            }
            setTimeout(function() {
                timed = true;
                tryHide();
            }, MIN);
            if (document.readyState === 'complete') {
                ready = true;
                tryHide();
            } else window.addEventListener('load', function() {
                ready = true;
                tryHide();
            });
        })();
    </script>

    <!-- Carousel Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const track = document.getElementById('team-track');
        const cards = document.querySelectorAll('.member-card');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // Function to update the active card based on scroll position
        const updateActiveCard = () => {
            const trackCenter = track.getBoundingClientRect().left + track.getBoundingClientRect().width / 2;
            let closestCard = cards[0];
            let closestDist = Infinity;

            cards.forEach(card => {
                const cardCenter = card.getBoundingClientRect().left + card.getBoundingClientRect().width / 2;
                const dist = Math.abs(trackCenter - cardCenter);
                if (dist < closestDist) {
                    closestDist = dist;
                    closestCard = card;
                }
            });

            cards.forEach(card => card.classList.remove('active'));
            if(closestCard) {
                closestCard.classList.add('active');
            }
        };

        track.addEventListener('scroll', updateActiveCard);

        // Initial setup
        setTimeout(() => {
            // Select Yara's card to be centered (index 2 in the new DOM order)
            if(cards.length > 2 && window.innerWidth > 768) {
                const centerCard = cards[2];
                track.scrollTo({
                    left: centerCard.offsetLeft - track.offsetWidth / 2 + centerCard.offsetWidth / 2,
                    behavior: 'smooth'
                });
                updateActiveCard();
            }
        }, 100);

        // Navigation buttons logic
        const scrollByAmount = 350; // card width + gap approx
        
        // Note: direction is rtl, so next means scroll left (negative), prev means scroll right (positive)
        prevBtn.addEventListener('click', () => {
            track.scrollBy({ left: scrollByAmount, behavior: 'smooth' });
        });

        nextBtn.addEventListener('click', () => {
            track.scrollBy({ left: -scrollByAmount, behavior: 'smooth' });
        });
        
        // Click on card to center it or show details on mobile
        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    cards.forEach(c => {
                        if (c !== card) c.classList.remove('mobile-show');
                    });
                    card.classList.toggle('mobile-show');
                } else {
                    track.scrollTo({
                        left: card.offsetLeft - track.offsetWidth / 2 + card.offsetWidth / 2,
                        behavior: 'smooth'
                    });
                }
            });
        });
    });
    </script>
